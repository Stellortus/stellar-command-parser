name: Publish and Trigger JitPack

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时触发

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build with Gradle
        run: ./gradlew build -Pversion=${{ steps.get_version.outputs.VERSION }}

      # 自动创建 Release 并上传 JAR
      - name: Create Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger JitPack build
        run: |
          sleep 30
          curl -s -o /dev/null -w "%{http_code}" \
            "https://jitpack.io/com/github/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ steps.get_version.outputs.VERSION }}/${{ github.event.repository.name }}-${{ steps.get_version.outputs.VERSION }}.pom"